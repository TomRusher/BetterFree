<style>
:root{--bg:#0B0F17;--card:#121826;--line:#1D2638;--sage:#8A9A86;--blue:#9DB4E0;--blue2:#5C7FB8;--tx:#EDE6D8;--mu:#8892A4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 0;height:48px}
header b{font-weight:600;letter-spacing:.2px;color:var(--sage)}
main{flex:1;overflow-y:auto;padding:8px 20px 24px}
h1{font-size:26px;line-height:32px;font-weight:600;margin:6px 0 4px}
h2{font-size:17px;margin:0 0 6px;font-weight:600}
.mu{color:var(--mu);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}
.card p{margin:8px 0 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:27px;background:var(--sage);color:#0B0F17;font-weight:600;margin-top:16px}
.btn.g{background:none;border:1px solid #3A4A66;color:#C9D3E6}.btn:disabled{background:#1A2233;color:#6B7689}
textarea{width:100%;min-height:96px;margin-top:12px;background:#0F1522;border:1px solid #27324A;border-radius:16px;padding:14px;color:var(--tx);font:inherit;resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
nav{display:flex;border-top:1px solid var(--line);background:#0E1420;padding:8px 4px 10px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#6B7689}
nav button.on{color:var(--sage)}svg{display:block}
.seg{display:flex;background:#0F1522;border:1px solid var(--line);border-radius:14px;padding:3px;margin-top:12px}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:14px;color:var(--mu)}.seg button.on{background:#1B2540;color:var(--blue)}
.dots{display:flex;gap:7px;justify-content:center;margin-top:16px}.dots i{width:7px;height:7px;border-radius:4px;background:#27324A}.dots i.on{width:22px;background:var(--sage)}
.stones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.stone{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 14px;text-align:center}
.stone .s{height:54px;margin:0 auto 10px;background:linear-gradient(145deg,#a3b19f,#6f8069)}
.stone.lock{opacity:.45}.stone.lock .s{background:none;border:1.5px dashed #3A4A66}
.stone b{display:block;font-size:14px}.stone span{font-size:12px;color:var(--mu)}
.chip{display:block;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border-radius:14px;background:#0F1522;border:1px solid #27324A;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tg{width:48px;height:28px;border-radius:14px;background:#27324A;position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#C9D3E6;transition:.2s}
.tg.on{background:var(--sage)}.tg.on:after{left:23px;background:#0B0F17}
.ov{position:fixed;inset:0;background:rgba(5,8,13,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{width:100%;max-width:430px;max-height:88%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.bar{height:8px;border-radius:4px;background:#1A2233;margin-top:6px}.bar i{display:block;height:8px;border-radius:4px;background:var(--sage)}
#bc{width:170px;height:170px;border-radius:85px;margin:24px auto 8px;background:#12203A;border:2px solid var(--blue2);display:flex;align-items:center;justify-content:center;flex-direction:column;transform:scale(.6)}
@media (prefers-reduced-motion:reduce){#bc{transition:none!important}}
.brand{display:flex;align-items:center;gap:8px}
.si{width:76px;height:76px;margin:0 auto 10px}.si svg{width:100%;height:100%}
.note{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.note.sel{border-color:var(--sage)}.note .mu{display:block;margin-bottom:4px}
.note .nx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:14px;padding:6px 0}

const STN={
ch1:{c:["#8A9A86","#B3C0AF"],b:'<path d="M10 42c0-11 10-18 22-18s22 7 22 17c0 8-9 13-22 13S10 51 10 42z"/>',e:'<circle cx="32" cy="42" r="2.6"/>'},
ch4:{c:["#8A9A86","#B3C0AF"],b:'<path d="M14 32c0-9 8-15 18-15s18 6 18 15v12c0 6-8 10-18 10s-18-4-18-10z"/>',e:'<path d="M24 31h16M24 38h16M24 45h16"/>'},
ch7:{c:["#8A9A86","#B3C0AF"],b:'<path d="M12 36c0-11 9-19 20-19s20 8 20 19-9 17-20 17-20-6-20-17z"/>',e:'<path d="M34 20l-5 9 7 6-6 9 4 7"/>'},
urge:{c:["#5C7FB8","#9DB4E0"],b:'<path d="M9 38c0-10 10-17 23-17s23 7 23 17-10 15-23 15S9 48 9 38z"/>',e:'<path d="M18 38q5-7 10 0t10 0 8 0"/>'},
why:{c:["#5C7FB8","#9DB4E0"],b:'<path d="M14 34c0-9 8-16 18-16s18 7 18 16-8 18-18 18-18-9-18-18z"/>',e:'<path d="M32 26l7 9-7 9-7-9z"/>'},
week:{c:["#8A9A86","#B3C0AF"],b:'<path d="M10 40c0-12 10-20 22-20s22 8 22 20c0 8-10 13-22 13S10 48 10 40z"/>',e:'<path d="M20 44h24M26 44a6 6 0 0 1 12 0M32 31v-3M22 34l-2-2M42 34l2-2"/>'}};
function stoneSVG(id,u){const s=STN[id];if(u)return `<svg viewBox="0 0 64 64" fill="none" role="img" aria-hidden="true"><g fill="${s.c[0]}">${s.b}</g><path d="M17 33c3-6 9-9 15-9" stroke="${s.c[1]}" stroke-width="3" stroke-linecap="round" opacity=".55"/><g stroke="#0B0F17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".6">${s.e}</g></svg>`;
return `<svg viewBox="0 0 64 64" fill="none" role="img" aria-hidden="true"><g stroke="#3A4A66" stroke-width="1.6" stroke-dasharray="3 3">${s.b}</g><g stroke="#2A3550" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3">${s.e}</g></svg>`}
const ico=(k,sz=24)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const today=()=>new Date().toISOString().slice(0,10);
const graduated=()=>S.done>=CH.length&&(S.grad||Date.now()-S.started>=60*864e5);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function stones(){const a=new Set(S.stones);if(S.done>=1)a.add("ch1");if(S.done>=4)a.add("ch4");if(S.done>=CH.length)a.add("ch7");if(S.mot.length)a.add("why");if(S.streak>=7)a.add("week");S.stones=[...a];save()}
function go(k){clearInterval(timer);stopB();S.tab=k;save();render()}
function nav(){if(!S.ms&&S.tab==="ms")S.tab="home";const tabs=["ms","art","home","jr","sos"].filter(k=>k!=="ms"||S.ms);
$("#nav").innerHTML=tabs.map(k=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')">${ico(k)}${t(k)}</button>`).join("");$("#gear").innerHTML=ico("gear",22)}
function render(){nav();document.documentElement.lang=S.lang;const v={ms:vMs,art:vArt,home:vHome,jr:vJr,sos:vSos}[S.tab]();$("#main").innerHTML=v;$("#main").scrollTop=0;if(S.tab==="home"&&!graduated()&&S.done<CH.length)startTimer();if(sos.ph==="fb"&&S.tab==="sos")startB()}
const seg=(key,opts)=>`<div class="seg">${opts.map(([k,l])=>`<button class="${S.seg[key]===k?"on":""}" onclick="S.seg.${key}='${k}';save();render()">${l}</button>`).join("")}</div>`;
function vMs(){return `<h1>${t("stonesT")}</h1><div class="mu">${t("stonesS")}</div><div class="stones">${ST.map(s=>{const u=S.stones.includes(s.id);return `<div class="stone ${u?"":"lock"}"><div class="si">${stoneSVG(s.id,u)}</div><b>${c(s.t)}</b><span>${u?c(s.d):"·"}</span></div>`}).join("")}</div>`}
function line(ser,xl){const w=320,h=150,p=20;return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img"><path d="M${p} ${h-p}H${w-p}" stroke="#27324A"/>${ser.map(s=>{const P=s.v.map((v,i)=>[p+i*(w-2*p)/(s.v.length-1),h-p-v*(h-2*p)/100]);const d=P.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join("");return `<path d="${d}L${w-p} ${h-p}L${p} ${h-p}Z" fill="${s.c}" opacity=".1"/><path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`}).join("")}<text x="${p}" y="${h-4}" fill="#8892A4" font-size="10">${xl[0]}</text><text x="${w-p}" y="${h-4}" text-anchor="end" fill="#8892A4" font-size="10">${xl[1]}</text></svg>`}
function vArt(){const b=seg("art",[["read",t("read")],["data",t("data")]]);
if(S.seg.art==="read")return `<h1>${t("art")}</h1>${b}`+AR.map(a=>`<div class="card"><h2>${c(a.t)}</h2><p>${c(a.b)}</p></div>`).join("");
const cs=S.lang==="cs",xl=["0",cs?"12 měs.":"12 mo"];
return `<h1>${t("art")}</h1>${b}<div class="card"><h2>${cs?"Co lidem pomáhá":"What helps people most"}</h2>${BARS.map(([l,v])=>`<div style="margin-top:12px;font-size:14px;display:flex;justify-content:space-between"><span>${c(l)}</span><span class="mu">${v}%</span></div><div class="bar"><i style="width:${v}%"></i></div>`).join("")}</div>
<div class="card"><h2>${cs?"Obnova citlivosti odměny":"Recovery of reward sensitivity"}</h2>${line([{v:[10,18,30,44,56,66,74,80,85,89,92,94,96],c:"#8A9A86"}],xl)}</div>
<div class="card"><h2>${cs?"Stabilizace dopaminového základu":"Dopamine baseline stabilizing"}</h2>${line([{v:[40,34,30,32,38,48,58,66,72,76,78,80,80],c:"#8A9A86"},{v:[40,41,42,42,43,43,44,44,44,45,45,45,45],c:"#5C7FB8"}],xl)}<div class="mu" style="margin-top:6px">${cs?"Zelená: bez návyku · Modrá: s návykem":"Green: without the habit · Blue: with it"}</div></div><p class="mu">${t("ill")}</p>`}
function vHome(){if(graduated())return `<div style="text-align:center;padding-top:48px"><div style="width:96px;height:96px;margin:0 auto;border-radius:48px;border:2px solid var(--sage);display:flex;align-items:center;justify-content:center;color:var(--sage)"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div><h1 style="font-size:32px;margin-top:24px">${t("free")}</h1><p class="mu" style="font-size:17px">${t("freeB")}</p><button class="btn" onclick="wipe()">${t("clear")}</button></div>`;
if(rem0===undefined)rem0=S.mot.length&&Math.random()<.6?S.mot[Math.floor(Math.random()*S.mot.length)]:null;
const h=rem0?`<div class="card" style="margin-top:4px;background:#101a2c"><div class="mu">${t("rem")}</div><p style="font-style:italic">“${esc(rem0)}”</p></div>`:"";
if(S.done>=CH.length)return h+`<h1>${t("silent")}</h1><p class="mu">${t("silentB")}</p>`+ci();
const n=S.done,ch=CH[n];
return h+`<h1>${S.prog?t("chapter")+" "+(n+1)+": ":""}${c(ch.t)}</h1><div class="card"><div class="mu">${t("today")}</div><p>${c(ch.b)}</p><textarea id="ref" placeholder="${c(ch.q)}" oninput="refresh()"></textarea></div>${S.prog?`<div class="dots">${CH.map((_,i)=>`<i class="${i===n?"on":""}"></i>`).join("")}</div>`:""}<button class="btn" id="cb" disabled onclick="finish()"></button>`+ci()}
function ci(){return S.lastCheck===today()?"":`<div class="card"><p style="margin:0">${t("ci")}</p><button class="btn g" style="height:46px" onclick="chk(1)">${t("ci1")}</button><button class="btn g" style="height:46px;margin-top:8px" onclick="chk(0)">${t("ci2")}</button></div>`}
function chk(ok){S.lastCheck=today();S.streak=ok?S.streak+1:0;stones();render()}
function refresh(){const b=$("#cb");if(!b)return;const ok=($("#ref")?.value.trim().length||0)>=12;b.disabled=wl>0&&!ok;b.textContent=b.disabled?t("wait")+" "+wl+"s":t("cont")}
function startTimer(){clearInterval(timer);wl=5;refresh();timer=setInterval(()=>{wl--;refresh();if(wl<=0)clearInterval(timer)},1000)}
function finish(){S.done++;stones();rem0=undefined;render()}
function vJr(){const b=seg("jr",[["notes",t("notes")],["mot",t("mot")]]);const lb=`<div class="mu" style="margin-top:12px;display:flex;gap:8px;align-items:center;color:var(--blue)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>${t("local")}</div>`;
if(S.seg.jr==="notes"){const cur=S.notes.find(n=>n.k===nd),isT=nd===today(),past=S.notes.filter(n=>n.k!==nd);
return `<h1>${t("jr")}</h1>${b}${lb}<div class="mu" style="margin-top:14px">${isT?t("noteT"):dl(nd)}</div><textarea id="nt" style="min-height:170px;margin-top:8px" placeholder="${t("ph")}">${cur?esc(cur.x):""}</textarea><button class="btn" onclick="addNote()">${t("save")}</button>${isT?"":`<button class="btn g" style="height:46px" onclick="nd=today();render()">${t("toToday")}</button>`}<div class="mu" style="margin-top:20px">${t("noteH")}</div>${past.length?`<h2 style="margin-top:14px">${t("prev")}</h2>`+past.map(n=>`<button class="note" onclick="editNote('${n.k||""}')"><span class="mu">${n.k?dl(n.k):n.d}</span><span class="nx">${esc(n.x)}</span></button>`).join(""):""}`}
return `<h1>${t("jr")}</h1>${b}${lb}<div class="card" style="margin-top:12px"><h2>${t("why")}</h2><textarea id="mt"></textarea><button class="btn" onclick="addMot()">${t("saveM")}</button></div><div class="card"><h2>${t("others")}</h2>${OTH.map((o,i)=>`<button class="chip" onclick="adopt(${i})">${c(o)}</button>`).join("")}</div>${S.mot.map(m=>`<div class="card"><p style="margin:0">${esc(m)}</p></div>`).join("")}`}
let nd=today();
function dl(k){try{return new Date(k+"T12:00:00").toLocaleDateString(S.lang==="cs"?"cs-CZ":"en-GB",{weekday:"long",day:"numeric",month:"long"})}catch(e){return k}}
function addNote(){const x=$("#nt").value.trim();if(!x)return;const e=S.notes.find(n=>n.k===nd);if(e)e.x=x;else S.notes.push({k:nd,d:dl(nd),x});S.notes.sort((a,b)=>(b.k||"").localeCompare(a.k||""));save();render()}
function editNote(k){if(!k)return;nd=k;render()}
function addMot(){const x=$("#mt").value.trim();if(!x)return;S.mot.push(x);rem0=undefined;stones();render()}
function adopt(i){$("#mt").value=c(OTH[i]);$("#mt").focus()}
function vSos(){const q=k=>`<h1>${k}</h1>`;
if(sos.ph==="pick")return `${q(t("sos1"))}${Object.entries(SOS).map(([k,v])=>`<button class="chip" style="padding:16px;font-size:16px" onclick="pick('${k}')">${c(v.l)}</button>`).join("")}`;
const cur=SOS[sos.s];
const bk=`<button class="back" onclick="sosBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>${t("bk")}</button>`;
if(sos.ph==="q")return `${bk}${cur.n&&sos.i===0?`<div class="card" style="margin-top:4px"><p style="margin:0">${c(cur.n)}</p></div>`:""}${q(c(cur.ch[sos.i][0]))}<button class="btn" onclick="sosTo({ph:'t'})">${t("yes")}</button><button class="btn g" onclick="nextQ()">${t("no")}</button>`;
if(sos.ph==="t")return `${bk}<div class="card" style="margin-top:4px"><p style="margin:0;font-size:18px">${c(cur.ch[sos.i][1])}</p></div><button class="btn" onclick="accept()">${t("doit")}</button><button class="btn g" onclick="nextQ()">${t("other")}</button>`;
if(sos.ph==="fb")return `${bk}${q(t("fb"))}<div id="bc"><b id="bl" style="font-size:19px;color:#C9D8F2"></b><b id="bn" style="font-size:30px"></b></div><div class="card"><p style="margin:0">${t("fbB")}</p></div><button class="btn" onclick="accept()">${t("calm")}</button>`;
return `${q(t("doneT"))}<div class="card"><p style="margin:0">${t("doneB")}</p></div><button class="btn g" onclick="sos={s:null,i:0,ph:'pick',h:[]};render()">${t("back")}</button>`}
function sosTo(n){stopB();sos.h.push({s:sos.s,i:sos.i,ph:sos.ph});Object.assign(sos,n);render()}
function sosBack(){stopB();const p=sos.h.pop();if(p){sos.s=p.s;sos.i=p.i;sos.ph=p.ph}else{sos.s=null;sos.i=0;sos.ph="pick"}render()}
function pick(k){sos={s:k,i:0,ph:"pick",h:[]};sosTo({s:k,i:0,ph:"q"});if(k==="gave"){S.streak=0;save()}}
function nextQ(){if(sos.i+1<SOS[sos.s].ch.length)sosTo({i:sos.i+1,ph:"q"});else sosTo({ph:"fb"})}
function accept(){stopB();if(!S.stones.includes("urge"))S.stones.push("urge");save();sos.h=[];sos.ph="done";render()}
function stopB(){clearTimeout(bt)}
function startB(){const P=[["in",4,1],["hold",7,1],["out",8,.6]];let i=0;const step=()=>{const el=$("#bc");if(!el)return;const[k,s,sc]=P[i%3];$("#bl").textContent=t(k);el.style.transition=k==="hold"?"none":"transform "+s+"s ease-in-out";el.style.transform="scale("+sc+")";let n=s;$("#bn").textContent=n;const tick=()=>{n--;if(n>0&&$("#bn")){$("#bn").textContent=n;bt=setTimeout(tick,1000)}else{i++;step()}};bt=setTimeout(tick,1000)};setTimeout(step,50)}
function tg(k){S[k]=!S[k];save();openSet();render()}
function openSet(){$("#ov").innerHTML=`<div class="ov" onclick="if(event.target===this)closeSet()"><div class="sheet" role="dialog" aria-modal="true"><h1>${t("settings")}</h1>
<div class="row"><span>${t("tMs")}</span><button class="tg ${S.ms?"on":""}" onclick="tg('ms')" aria-label="${t("tMs")}"></button></div>
<div class="row"><span>${t("tPr")}</span><button class="tg ${S.prog?"on":""}" onclick="tg('prog')" aria-label="${t("tPr")}"></button></div>
<div class="row"><span>${t("lang")}</span><div class="seg" style="margin:0;width:120px"><button class="${S.lang==="en"?"on":""}" onclick="setL('en')">EN</button><button class="${S.lang==="cs"?"on":""}" onclick="setL('cs')">CS</button></div></div>
<div class="card"><h2>${t("sup")}</h2><p class="mu" style="font-size:14px">${t("supB")}</p><button class="btn g" style="height:46px" onclick="this.textContent=t('payD')">${t("pay")}</button></div>
<div class="card"><h2>${t("proto")}</h2><button class="btn g" style="height:44px;margin-top:8px" onclick="S.done=CH.length;S.grad=true;stones();closeSet();go('home')">${t("pGrad")}</button><button class="btn g" style="height:44px;margin-top:8px" onclick="S.streak=7;stones();closeSet();go(S.ms?'ms':'home')">${t("pWeek")}</button></div>
<button class="btn" onclick="closeSet()">${t("close")}</button></div></div>`}
function setL(l){S.lang=l;save();rem0=undefined;openSet();render()}
function closeSet(){$("#ov").innerHTML=""}
function wipe(){try{localStorage.removeItem("bf")}catch(e){}$("#main").innerHTML=`<div style="padding-top:80px;text-align:center"><p style="font-size:18px">${t("cleared")}</p></div>`;$("#nav").innerHTML=""}
stones();render();
</script></body></html>
